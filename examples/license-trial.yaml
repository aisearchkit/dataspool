# Dataspool Trial License
#
# 30-day trial with Professional tier features

license_id: "TRIAL-30DAYS-DEMO"
organization: "Trial User"
tier: professional
license_type: trial

# Trial includes most features except enterprise-only
features:
  - document_migration
  - relational_migration
  - streaming_migration
  - no_sql_migration
  - object_storage_migration
  - local_shard_reader
  - advanced_transforms

# 30-day validity
issued_at: "2026-02-14T00:00:00Z"
expires_at: "2026-03-16T00:00:00Z"

# Trial limits
max_nodes: 3
max_tasks_per_day: 100

metadata:
  trial_start_reason: "Product evaluation"
  contact_email: "trial@example.com"
