name: Dependabot Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-after-ci:
    name: Merge CI dependency update after full CI succeeds
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for full CI and merge CI-only dependency update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files?per_page=100")"
          if ! jq -e 'length == 1 and .[0].filename == ".github/workflows/ci.yml"' <<<"$files" >/dev/null; then
            echo "This Dependabot PR does not exclusively update the CI workflow; leaving it for manual review."
            exit 0
          fi

          expected='["Format Check","Clippy Lints","Test Suite","Security Audit","Elasticsearch 7102 three-node soak","Elasticsearch 717 three-node soak","Elasticsearch 8x three-node soak","Elasticsearch 9x three-node soak","Build Release"]'
          deadline=$((SECONDS + 3 * 60 * 60))

          while (( SECONDS < deadline )); do
            checks="$(gh api "repos/${GH_REPO}/commits/${PR_HEAD_SHA}/check-runs?per_page=100")"
            if jq -e --argjson expected "$expected" '
              .check_runs as $runs |
              any($expected[]; . as $name | any($runs[]; .name == $name and .status == "completed" and .conclusion != "success"))
            ' <<<"$checks" >/dev/null; then
              echo "At least one required CI job failed; Dependabot PR will not be merged." >&2
              jq -r '.check_runs[] | select(.status == "completed" and .conclusion != "success") | "\(.name): \(.conclusion)"' <<<"$checks" >&2
              exit 1
            fi

            if jq -e --argjson expected "$expected" '
              .check_runs as $runs |
              all($expected[]; . as $name | any($runs[]; .name == $name and .status == "completed" and .conclusion == "success"))
            ' <<<"$checks" >/dev/null; then
              echo "All nine CI jobs passed for ${PR_HEAD_SHA}; merging ${PR_URL}."
              gh pr merge --squash --delete-branch "$PR_URL"

              merge_sha="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha')"
              if [[ -z "$merge_sha" || "$merge_sha" == "null" ]]; then
                echo "Unable to determine the Dependabot merge commit SHA." >&2
                exit 1
              fi
              tag="deps-$(date -u +%Y%m%d)-${merge_sha:0:7}"
              git fetch origin main
              if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
                echo "Tag ${tag} already exists."
              else
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git tag -a "$tag" "$merge_sha" -m "Dependabot CI dependency PR #${PR_NUMBER} (full CI passed)"
                git push origin "refs/tags/${tag}"
                echo "Created ${tag}."
              fi
              exit 0
            fi

            echo "Waiting for all nine CI jobs to complete..."
            sleep 30
          done

          echo "Timed out waiting for the complete CI matrix; Dependabot PR was not merged." >&2
          exit 1
