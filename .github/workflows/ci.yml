name: CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain*'
      - '.cargo/**'
      - '.github/workflows/**'
      - 'proto/**'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'deploy/compose/**'
      - 'scripts/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain*'
      - '.cargo/**'
      - '.github/workflows/**'
      - 'proto/**'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'deploy/compose/**'
      - 'scripts/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # RocksDB 10.x trace_record.h uses uint32_t/uint64_t without including <cstdint>.
  CXXFLAGS: -include cstdint

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang libclang-dev llvm-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run library and binary unit tests
        run: cargo test --lib --bins --all-features
      - name: Run multi-member Raft failover integration
        run: cargo test --test raft_failover --all-features -- --nocapture
