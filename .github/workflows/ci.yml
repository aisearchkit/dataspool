name: CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain*'
      - '.cargo/**'
      - '.github/workflows/**'
      - 'proto/**'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'deploy/compose/**'
      - 'deploy/prometheus/**'
      - 'docs/operations/federated-trust-rotation.md'
      - 'docs/operations/dlq-admin-api.md'
      - 'scripts/**'
      - 'web/**'
      - '.agents/skills/**'
      - 'skills-lock.json'
      - 'DEVELOPMENT.md'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain*'
      - '.cargo/**'
      - '.github/workflows/**'
      - 'proto/**'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'deploy/compose/**'
      - 'deploy/prometheus/**'
      - 'docs/operations/federated-trust-rotation.md'
      - 'docs/operations/dlq-admin-api.md'
      - 'scripts/**'
      - 'web/**'
      - '.agents/skills/**'
      - 'skills-lock.json'
      - 'DEVELOPMENT.md'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # RocksDB 10.x trace_record.h uses uint32_t/uint64_t without including <cstdint>.
  CXXFLAGS: -include cstdint

jobs:
  prometheus-rules:
    name: Validate Prometheus alert rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate federation trust-rotation rules
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          -v "${{ github.workspace }}:/work:ro"
          prom/prometheus:v3.5.0
          check rules /work/deploy/prometheus/federation-trust-rotation-alerts.yml

  frontend-static-check:
    name: Validate trust-rotation operator UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check inline operator UI JavaScript
        run: scripts/check_trust_rotation_ui.sh
      - name: Validate installed Rust Agent Skills
        run: python3 scripts/check_agent_skills.py

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    env:
      DATASPOOL_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/dataspool_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dataspool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dataspool_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang libclang-dev llvm-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run library and binary unit tests
        run: cargo test --lib --bins --all-features
      - name: Run PostgreSQL transactional Outbox integration
        run: cargo test --test postgres_outbox -- --nocapture
      - name: Run PostgreSQL Outbox and Raft cutover integration
        run: cargo test --test postgres_cutover -- --nocapture
      - name: Run multi-member Raft failover integration
        run: cargo test --test raft_failover --all-features -- --nocapture
      - name: Build deployable Dataspool binary
        run: cargo build --bin dataspool
      - name: Smoke-test deployed operator recovery API and authenticated audit identity
        run: scripts/smoke_trust_rotation_deployment.sh
