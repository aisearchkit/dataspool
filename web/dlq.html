<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dataspool · Dead Letter Queue</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1f27;--line:#303744;--text:#e7eaf0;--muted:#9aa4b2;--accent:#78a9ff;--danger:#ff7777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}main{max-width:1180px;margin:36px auto;padding:0 22px}h1{font-size:24px;margin:0 0 8px}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:10px}input,button{font:inherit;border-radius:7px;border:1px solid var(--line);padding:10px;background:#10141b;color:var(--text)}button{cursor:pointer;background:#263d62;border-color:#385c8e}button.danger{background:#512a30;border-color:#85444c}button:disabled{opacity:.5;cursor:not-allowed}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:540px;max-height:180px;overflow:auto;margin:0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}#message{min-height:22px;color:var(--muted)}.select{width:18px;height:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}.panel{overflow:auto}table{min-width:760px}}
</style>
</head>
<body><main>
<h1>Dead Letter Queue</h1><div class="muted">Inspect permanent document failures, select records, and replay them to the configured task sink.</div>
<section class="panel"><div class="grid"><input id="token" type="password" autocomplete="off" placeholder="Admin bearer token"><input id="task" placeholder="Task UUID"><input id="shard" placeholder="Shard UUID"><button id="load">Load queue</button></div><div class="toolbar" style="margin-top:12px"><span id="summary" class="muted">Not connected</span><span class="right"></span><button id="replay" disabled>Replay selected</button><button id="prev" disabled>Previous</button><button id="next" disabled>Next</button><button id="refresh" disabled>Refresh</button></div><div id="message" role="status" aria-live="polite"></div></section>
<section class="panel"><table><thead><tr><th><input id="all" class="select" type="checkbox" aria-label="Select all"></th><th>Entry</th><th>Status</th><th>Failure</th><th>Attempts</th><th>Document</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="muted">Load a task and shard to view entries.</td></tr></tbody></table></section>
</main>
<script>
const $=id=>document.getElementById(id);let entries=[],offset=0,total=0;const pageSize=200;const endpoint=()=>`/api/v1/tasks/${encodeURIComponent($('task').value.trim())}/shards/${encodeURIComponent($('shard').value.trim())}/dlq`;const headers=()=>({'Authorization':`Bearer ${$('token').value}`,'Content-Type':'application/json'});const say=s=>$('message').textContent=s;
async function api(url,options={}){const r=await fetch(url,{...options,headers:{...headers(),...(options.headers||{})}});if(!r.ok){let m=`HTTP ${r.status}`;try{m=(await r.json()).error||m}catch{}throw Error(m)}return r.status===204?null:r.json()}
function render(data){entries=data.entries;total=data.total;$('summary').textContent=`${data.total} entries · ${offset+1}-${Math.min(offset+entries.length,total)}`;$('prev').disabled=offset===0;$('next').disabled=offset+entries.length>=total;$('rows').innerHTML='';for(const e of entries){const tr=document.createElement('tr');const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.className='select';checkbox.dataset.id=e.id;checkbox.addEventListener('change',sync);const doc=document.createElement('pre');doc.textContent=JSON.stringify(e.record.payload,null,2);const failure=document.createElement('div');failure.textContent=`${e.error_type}\n${e.reason}`;const action=document.createElement('button');action.className='danger';action.textContent='Discard';action.addEventListener('click',async()=>{if(!confirm(`Permanently discard DLQ entry ${e.id}?`))return;try{await api(`${endpoint()}/${e.id}`,{method:'DELETE'});await load()}catch(err){say(err.message)}});for(const value of [checkbox,e.id.slice(0,12)+'…',e.status,failure,e.attempts,doc,action]){const td=document.createElement('td');if(value instanceof Node)td.append(value);else td.textContent=String(value);tr.append(td)}$('rows').append(tr)}if(!entries.length)$('rows').innerHTML='<tr><td colspan="7" class="muted">No failed documents.</td></tr>';sync()}
function sync(){const selected=[...document.querySelectorAll('tbody input:checked')];$('replay').disabled=!selected.length;$('all').checked=entries.length>0&&selected.length===entries.length}
async function load(){try{const data=await api(`${endpoint()}?limit=${pageSize}&offset=${offset}`);render(data);$('refresh').disabled=false;say('Queue loaded.')}catch(e){say(e.message)}}
$('load').onclick=()=>{offset=0;load()};$('refresh').onclick=load;$('prev').onclick=()=>{offset=Math.max(0,offset-pageSize);load()};$('next').onclick=()=>{if(offset+pageSize<total){offset+=pageSize;load()}};$('all').onchange=()=>{document.querySelectorAll('tbody input[type=checkbox]').forEach(c=>c.checked=$('all').checked);sync()};$('replay').onclick=async()=>{const ids=[...document.querySelectorAll('tbody input:checked')].map(c=>c.dataset.id);if(!confirm(`Replay ${ids.length} selected records to the task sink?`))return;try{const result=await api(`${endpoint()}/replay`,{method:'POST',body:JSON.stringify({ids})});say(`Replayed ${result.replayed}/${result.selected}; ${result.remaining} entries remain.`);await load()}catch(e){say(e.message)}};
</script></body></html>
