// Dataspool - Hybrid-mode data migration and orchestration platform

syntax = "proto3";

package dataspool.task;

import "google/protobuf/timestamp.proto";

// ==================== Task CRUD ====================

message CreateTaskRequest {
  string name = 1;
  string source_config = 2;  // JSON-serialized SourceConfig
  string sink_config = 3;    // JSON-serialized SinkConfig
  string transform_config = 4;  // JSON-serialized TransformConfig
  string sharding_strategy = 5;  // JSON-serialized ShardingStrategy
  int32 priority = 6;  // 0=Low, 1=Normal, 2=High, 3=Critical
  map<string, string> tags = 7;
  string request_id = 8;  // Idempotency key for client retries
}

message CreateTaskResponse {
  bool success = 1;
  string task_id = 2;
  string message = 3;
}

message GetTaskRequest {
  string task_id = 1;
}

message ListTasksRequest {
  uint32 page = 1; // 1-based page number
  uint32 page_size = 2; // 1-100, default 20
  string state = 3;
  string tag_key = 4;
  string tag_value = 5;
  string sort_by = 6; // created_at, priority, name
  bool descending = 7;
}

message ListTasksResponse {
  repeated TaskInfo tasks = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message GetTaskResponse {
  TaskInfo task = 1;
  repeated ShardInfo shards = 2;
}

message TaskInfo {
  string task_id = 1;
  string name = 2;
  string state = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  uint64 total_shards = 7;
  uint64 completed_shards = 8;
  uint64 failed_shards = 9;
  uint64 processed_records = 10;
  uint64 pending_shards = 11;
  uint64 running_shards = 12;
  uint64 processed_bytes = 13;
  uint64 elapsed_ms = 14;
  double throughput_docs_per_sec = 15;
  double throughput_bytes_per_sec = 16;
  repeated NodeTaskInfo nodes = 17;
}

message NodeTaskInfo {
  string node_id = 1;
  uint64 pending_shards = 2;
  uint64 running_shards = 3;
  uint64 completed_shards = 4;
  uint64 failed_shards = 5;
  uint64 processed_records = 6;
  uint64 processed_bytes = 7;
  double throughput_docs_per_sec = 8;
  double throughput_bytes_per_sec = 9;
}

message ShardInfo {
  string shard_id = 1;
  string task_id = 2;
  string state = 3;
  string assigned_node = 4;
  uint64 processed_records = 5;
  uint64 total_records = 6;
  uint64 processed_bytes = 7;
  uint64 fencing_token = 8;
  google.protobuf.Timestamp lease_expires_at = 9;
  string checkpoint = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// ==================== Task Control ====================

message AssignShardRequest {
  string shard_id = 1;
  string node_id = 2;
}

message AssignShardResponse {
  bool success = 1;
  string message = 2;
  string shard_config = 3;  // JSON-serialized shard parameters
}

message ReportProgressRequest {
  string shard_id = 1;
  string node_id = 2;
  uint64 processed_records = 3;
  uint64 total_records = 4;
  string offset = 5;  // JSON-serialized OffsetValue
}

message ReportProgressResponse {
  bool accepted = 1;
}

message CompleteShardRequest {
  string shard_id = 1;
  string node_id = 2;
  uint64 total_records = 3;
}

message CompleteShardResponse {
  bool success = 1;
  bool has_next_shard = 2;
  string next_shard_id = 3;
}

message FailShardRequest {
  string shard_id = 1;
  string node_id = 2;
  string error_message = 3;
}

message FailShardResponse {
  bool should_retry = 1;
}

message FederatedOperationRequest {
  string migration_id = 1;
  uint64 generation = 2;
  string task_id = 3;
  string request_id = 4;
}
message FederatedOperationResponse {
  bool accepted = 1;
  string state = 2;
  string checkpoint_digest = 3;
  string message = 4;
}
message FederatedCertificateRotationRequest {
  string new_fingerprint = 1;
  string request_id = 2;
  int64 grace_period_ms = 3;
}
message FederatedCertificateRotationResponse {
  bool accepted = 1;
  string state = 2;
  int64 previous_fingerprint_expires_at_ms = 3;
  string message = 4;
}
message FederatedTrustRotationRequest {
  string rotation_id = 1;
  string request_id = 2;
  string local_ca_bundle_pem = 3;
  string peer_ca_bundle_pem = 4;
  string local_leaf_fingerprint = 5;
  string peer_leaf_fingerprint = 6;
  int64 overlap_ms = 7;
  uint64 expected_revision = 8;
  string event_json = 9;
}
message FederatedTrustRotationResponse {
  bool accepted = 1;
  string state_json = 2;
  string message = 3;
}

message TaskControlRequest { string task_id = 1; string request_id = 2; }
message TaskControlResponse { bool success = 1; string message = 2; }
message NodeExecutionControlRequest { string node_id = 1; bool paused = 2; string request_id = 3; }
message NodeExecutionControlResponse { bool success = 1; string message = 2; }

// ==================== Service Definition ====================

service TaskService {
  // Task CRUD
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc PauseTask(TaskControlRequest) returns (TaskControlResponse);
  rpc ResumeTask(TaskControlRequest) returns (TaskControlResponse);
  rpc CancelTask(TaskControlRequest) returns (TaskControlResponse);
  rpc RetryTask(TaskControlRequest) returns (TaskControlResponse);
  rpc ControlNodeExecution(NodeExecutionControlRequest) returns (NodeExecutionControlResponse);
  
  // Task execution (called by Agents)
  rpc AssignShard(AssignShardRequest) returns (AssignShardResponse);
  rpc ReportProgress(ReportProgressRequest) returns (ReportProgressResponse);
  rpc CompleteShard(CompleteShardRequest) returns (CompleteShardResponse);
  rpc FailShard(FailShardRequest) returns (FailShardResponse);

  // Cross-cluster two-phase commit and compensation protocol.
  rpc PrepareFederatedCommit(FederatedOperationRequest) returns (FederatedOperationResponse);
  rpc CommitFederatedMigration(FederatedOperationRequest) returns (FederatedOperationResponse);
  rpc CompensateFederatedMigration(FederatedOperationRequest) returns (FederatedOperationResponse);
  // Rotation staging uses the currently trusted certificate; proof must use the new certificate.
  rpc StageFederatedCertificateRotation(FederatedCertificateRotationRequest) returns (FederatedCertificateRotationResponse);
  rpc ProveFederatedCertificateRotation(FederatedCertificateRotationRequest) returns (FederatedCertificateRotationResponse);
  // Bilateral CA and leaf lifecycle coordination across independent Raft groups.
  rpc CreateFederatedTrustRotation(FederatedTrustRotationRequest) returns (FederatedTrustRotationResponse);
  rpc AdvanceFederatedTrustRotation(FederatedTrustRotationRequest) returns (FederatedTrustRotationResponse);
  rpc GetFederatedTrustRotation(FederatedTrustRotationRequest) returns (FederatedTrustRotationResponse);
}
