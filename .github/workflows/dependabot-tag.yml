name: Tag successful Dependabot update

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  tag-dependency-update:
    name: Tag merged Dependabot update after unit tests
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create dependency-update tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          prs="$(gh api "repos/${GH_REPO}/commits/${COMMIT_SHA}/pulls")"
          pr="$(jq -c '[.[] | select(.user.login == "dependabot[bot]" and .merged_at != null)] | first // empty' <<<"$prs")"
          if [[ -z "$pr" ]]; then
            echo "No merged Dependabot PR is associated with this commit; skipping tag."
            exit 0
          fi

          pr_number="$(jq -r '.number' <<<"$pr")"
          files="$(gh api "repos/${GH_REPO}/pulls/${pr_number}/files?per_page=100")"
          if ! jq -e 'length > 0 and all(.[]; .filename == "Cargo.toml" or .filename == "Cargo.lock" or (.filename | startswith(".github/workflows/")) or .filename == ".github/dependabot.yml")' <<<"$files" >/dev/null; then
            echo "Dependabot PR #${pr_number} changes files outside the dependency/CI allowlist; skipping tag."
            exit 0
          fi

          short_sha="${COMMIT_SHA:0:7}"
          tag="deps-$(date -u +%Y%m%d)-${short_sha}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$COMMIT_SHA" -m "Dependabot dependency update PR #${pr_number} (unit tests passed)"
          git push origin "refs/tags/${tag}"
          echo "Created ${tag} after unit tests passed."
