[package]
name = "dataspool"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Dataspool Contributors"]
description = "Hybrid-mode data migration and orchestration platform"
repository = "https://github.com/aisearchkit/dataspool"
keywords = ["data-migration", "elasticsearch", "raft", "distributed-systems"]
categories = ["database", "command-line-utilities"]

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Raft consensus
openraft = { version = "0.9", features = ["serde"] }

# Storage
rocksdb = "0.22"

# Networking
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
hyper = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }
humantime-serde = "1.1"

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
bytes = "1.7"
parking_lot = "0.12"
num_cpus = "1.16"
hostname = "0.4"
dashmap = "6.1.0"
aws-sdk-s3 = "1.123.0"
aws-config = "1.8.14"
parquet = "57.3.0"
arrow = "57.3.0"

# HTTP client for search engine APIs (ES/OpenSearch compatible)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
url = "2.5"

tempfile = "3.12"
base64 = "0.22.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql", "postgres"] }

# Kafka client for streaming driver
rdkafka = { version = "0.36", features = ["tokio", "ssl", "gssapi", "zstd"] }

[dev-dependencies]
tempfile = "3.12"

[build-dependencies]
tonic-build = "0.12"

# HTTP client for license validation
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
