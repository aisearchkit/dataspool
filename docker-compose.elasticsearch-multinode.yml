services:
  es7102-1:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
    profiles: ["es7102"]
    environment:
      "cluster.name": "dataspool-es7102"
      "node.name": "es7102-1"
      "node.roles": "master,data,ingest"
      "network.host": "0.0.0.0"
      "discovery.seed_hosts": "es7102-1,es7102-2,es7102-3"
      "cluster.initial_master_nodes": "es7102-1,es7102-2,es7102-3"
      "xpack.security.enabled": "false"
      "ES_JAVA_OPTS": "-Xms512m -Xmx512m"
      "bootstrap.memory_lock": "true"
      "thread_pool.write.queue_size": "1"
      "cluster.routing.allocation.disk.threshold_enabled": "false"
    ports:
      - "19302:9200"
    volumes:
      - es7102-1-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

