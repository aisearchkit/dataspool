name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CXXFLAGS: -include cstdint

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64 release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\([^"]*\)"$/\1/p' | head -n1)"
          if [[ -z "$package_version" || "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) must match Cargo.toml version ($package_version)." >&2
            exit 1
          fi

      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci.yml --json status,conclusion)"
          if ! jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$runs" >/dev/null; then
            echo "No successful CI run found for release commit $GITHUB_SHA." >&2
            echo "$runs" >&2
            exit 1
          fi

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang libclang-dev llvm-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --verbose

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          staging="dataspool-${version}-linux-x86_64"
          mkdir -p "${staging}"
          install -m 0755 target/release/dataspool "${staging}/dataspool"
          install -m 0644 LICENSE README.md CHANGELOG.md "${staging}/"
          tar -czf "${staging}.tar.gz" "${staging}"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          file "${staging}/dataspool"
          test -s "${staging}/dataspool"

      - name: Publish draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            dataspool-${{ github.ref_name }}-linux-x86_64.tar.gz
            dataspool-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
